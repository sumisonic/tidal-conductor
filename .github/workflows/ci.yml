name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the comment is the release tag); Dependabot proposes updates.
jobs:
  node:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm format:check
      - run: pnpm test
      # the committed golden fixtures must be exactly what the emitter produces today
      - run: pnpm -s emit-pattern-cases --fixtures | diff - haskell/fixtures/golden.ndjson

  tidal:
    name: Tidal verification (aiPat spec + parseBP gate)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Determinate Nix pins the Nix version itself (nix-installer-action always fetches the latest)
      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # committed sources only: aiPat spec + golden fixtures, with the lock file frozen
      - run: nix flake check --no-update-lock-file --print-build-logs
      # the full generated sweep (data emitted by TypeScript, checked by the fixed Haskell runner)
      - run: pnpm verify:patterns
